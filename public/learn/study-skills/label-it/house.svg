<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="a simple drawing of a house">
  <!-- Everyday sample for "label it", drawn for Cueory in brand colors. Labels sit where content/label-it boxes cover them. -->
  <rect width="800" height="600" fill="#F9F5EF"/>
  <rect x="500" y="115" width="40" height="80" fill="#6B5243"/>
  <polygon points="160,225 400,95 640,225" fill="#8B6F5B"/>
  <rect x="200" y="225" width="400" height="295" fill="#EADCCF"/>
  <rect x="360" y="400" width="80" height="120" fill="#6B5243"/>
  <rect x="240" y="270" width="90" height="70" fill="#F9F5EF" stroke="#3F2E24" stroke-width="4"/>
  <line x1="172" y1="305" x2="240" y2="305" stroke="#3F2E24" stroke-width="2"/>
  <line x1="592" y1="96" x2="538" y2="118" stroke="#3F2E24" stroke-width="2"/>
  <line x1="400" y1="530" x2="400" y2="545" stroke="#3F2E24" stroke-width="2"/>
  <line x1="400" y1="72" x2="400" y2="93" stroke="#3F2E24" stroke-width="2"/>
  <g fill="#3F2E24" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30">
    <text x="400" y="62" text-anchor="middle">roof</text>
    <text x="600" y="102">chimney</text>
    <text x="110" y="315" text-anchor="middle">window</text>
    <text x="400" y="575" text-anchor="middle">door</text>
  </g>
</svg>
