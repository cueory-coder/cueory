<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <!-- Faint paper grain for marketing pages (D-41): noise tinted Espresso #3E2C23 at a few percent. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.243  0 0 0 0 0.173  0 0 0 0 0.137  0 0 0 0.06 0"/>
  </filter>
  <rect width="220" height="220" filter="url(#grain)"/>
</svg>
