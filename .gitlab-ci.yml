# Verification for the migrated application. No deployment or merge jobs.
# Keep production/release workflows out of scope until their legal gates are ported.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Preserve the existing policy of waiting until a change is ready for review.
    # CI_MERGE_REQUEST_DRAFT is documented for GitLab 17.10 and later:
    # https://docs.gitlab.com/ci/variables/predefined_variables/#predefined-variables-for-merge-request-pipelines
    - if: '$CI_MERGE_REQUEST_DRAFT == "true"'
      when: never
    - if: >-
        $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_PROJECT_ID == "88789754" &&
        $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == "88789754" &&
        $CI_MERGE_REQUEST_PROJECT_ID == "88789754" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "legacy/staging"
    # No duplicate push jobs, fork jobs, tags, schedules, or release pipelines.
    - when: never

stages:
  - checks
  - browser

default:
  # Keep this exact version aligned with .node-version.
  image: node:24.22.2-bookworm
  interruptible: true
  before_script:
    - 'test "$(node --version)" = "v$(cat .node-version)"'
    - npm ci --cache .npm --prefer-offline
  cache: &npm_download_cache
    key:
      prefix: node-24
      files:
        - package-lock.json
    paths:
      - .npm/
    # Only the checks job publishes this cache. Browser shards only read it.
    policy: pull

checks:
  stage: checks
  timeout: 15 minutes
  cache:
    <<: *npm_download_cache
    policy: pull-push
  script:
    - npm run check-sample-content
    - npm run check
    - npm run build
    - npm test

browser:
  stage: browser
  needs:
    - checks
  parallel: 4
  # This suite includes all four Chromium projects, including tablet and Evening.
  # Keep individual test timeouts unchanged while allowing each shard to finish.
  timeout: 30 minutes
  variables:
    PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/junit.xml
    PLAYWRIGHT_JUNIT_INCLUDE_PROJECT_IN_TEST_NAME: "true"
  script:
    - npx playwright install --with-deps chromium
    # Playwright's existing webServer builds the anatomy draft fixture itself.
    # Run all configured Chromium projects, including tablet and Evening.
    - npm run test:e2e -- --shard="$CI_NODE_INDEX/$CI_NODE_TOTAL" --reporter=line,junit
  artifacts:
    name: "browser-$CI_COMMIT_SHORT_SHA-$CI_NODE_INDEX"
    when: always
    expire_in: 7 days
    reports:
      junit: test-results/junit.xml
    paths:
      - test-results/
