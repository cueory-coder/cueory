image: node:22-alpine

stages:
  - verify

verify:
  stage: verify
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
  before_script:
    - npm install --cache .npm --prefer-offline --no-audit --no-fund
  script:
    - npm run build
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - dist/
