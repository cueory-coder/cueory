version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging # every change goes through staging first
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Astro's type checker accepts TypeScript only up to 6 (DECISIONS.md, D-02).
      - dependency-name: typescript
        versions: ['>=7.0.0']
      # Node's type files must match the Node major version in .node-version, which is 24 (D-01).
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
